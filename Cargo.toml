[package]
name = "lagscope"
version = "0.6.0"
edition = "2024"
description = "Lag/hiccup diagnostic recorder for The Finals (and other games) on Windows"
license = "MIT"
repository = "https://github.com/sevencooper/LagScope"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
nvml-wrapper = "0.13"
# GUI: OpenGL renderer, no persistence/accessibility extras (small, low overhead).
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_Graphics_Gdi",
    "Wdk_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Media",
    "Win32_Media_Multimedia",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = "line-tables-only"
